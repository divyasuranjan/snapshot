apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  labels:
    app: dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dashboard
  template:
    metadata:
      labels:
        app: dashboard
    spec:
      containers:
        - name: dashboard
          image: ghcr.io/divyasuranjan/snapshot-dashboard:latest
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            # Kubernetes auto-injects HOSTNAME as the pod's name (e.g.
            # "dashboard-65c4b7ffc4-dj2zg"). Next.js's standalone
            # server.js binds to whatever HOSTNAME says instead of all
            # interfaces, so without this override it only accepts
            # connections addressed to the pod's own IP -- the readiness
            # probe (which hits the pod IP directly) passes, but anything
            # going through the Service or a port-forward (loopback
            # inside the pod netns) gets connection refused.
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: ANALYTICS_WORKER_URL
              value: http://analytics-worker:8000
            - name: SHORTLINK_API_URL
              value: http://shortlink-api:8080
            - name: DEMO_MODE
              valueFrom:
                configMapKeyRef:
                  name: snapshot-config
                  key: demo-mode
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
