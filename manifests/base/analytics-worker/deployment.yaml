apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-worker
  labels:
    app: analytics-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-worker
  template:
    metadata:
      labels:
        app: analytics-worker
    spec:
      containers:
        - name: analytics-worker
          image: ghcr.io/divyasuranjan/snapshot-analytics-worker:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PORT
              value: "8000"
            - name: REDIS_ADDR
              value: redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: snapshot-secrets
                  key: analytics-database-url
