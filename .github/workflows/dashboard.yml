name: dashboard

on:
  push:
    branches: [main]
    paths:
      - "services/dashboard/**"
      - ".github/workflows/dashboard.yml"
  pull_request:
    paths:
      - "services/dashboard/**"
      - ".github/workflows/dashboard.yml"

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/snapshot-dashboard

defaults:
  run:
    working-directory: services/dashboard

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: services/dashboard/package-lock.json

      - run: npm ci

      - name: eslint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: vitest
        run: npm test

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/dashboard
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  update-manifest:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared group name across all three services' workflows -- see
    # shortlink-api.yml's update-manifest job for why.
    concurrency:
      group: manifest-update
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.8.1
          sudo mv kustomize /usr/local/bin/

      - name: Bump image tag, commit, and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Re-running the (idempotent) edit fresh each attempt, rather than
          # rebasing a stale commit, matters here: this file has every
          # service's image tag on adjacent lines, so if another service's
          # update-manifest job pushed first, a `git pull --rebase` of our
          # own stale commit hits a real textual conflict on that job's
          # line, not just a fast-forward gap. Resetting to the latest
          # main and reapplying `kustomize edit set image` sidesteps that
          # entirely -- it only ever touches this service's own line.
          for attempt in 1 2 3; do
            (cd manifests/overlays/production && kustomize edit set image "$IMAGE:${{ github.sha }}")
            git add manifests/overlays/production/kustomization.yaml

            if git diff --cached --quiet; then
              echo "Manifest already up to date"
              exit 0
            fi

            git commit -m "chore(manifests): deploy dashboard@${{ github.sha }}"

            if git push; then
              exit 0
            fi

            echo "Push rejected (attempt $attempt), resetting to latest main and retrying..."
            git fetch origin main
            git reset --hard origin/main
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
