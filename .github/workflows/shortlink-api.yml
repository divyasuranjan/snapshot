name: shortlink-api

on:
  push:
    branches: [main]
    paths:
      - "services/shortlink-api/**"
      - ".github/workflows/shortlink-api.yml"
  pull_request:
    paths:
      - "services/shortlink-api/**"
      - ".github/workflows/shortlink-api.yml"

concurrency:
  group: shortlink-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/snapshot-shortlink-api

defaults:
  run:
    working-directory: services/shortlink-api

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v7
        with:
          go-version-file: services/shortlink-api/go.mod

      - name: gofmt
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -cover

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/shortlink-api
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image already exists in the local Docker daemon (built above
      # for scanning) and passed Trivy, so this pushes that exact image --
      # it does not rebuild.
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  update-manifest:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared (not per-workflow) group name: if a single push touches
    # multiple services, each one's update-manifest job commits to the
    # same manifests/overlays/production/kustomization.yaml. Without this,
    # two concurrent jobs racing to `git push` there would step on each
    # other -- one wins, the other's push is rejected as non-fast-forward.
    # This serializes them (queued, not cancelled) instead.
    concurrency:
      group: manifest-update
    # Overrides the workflow-level default (services/shortlink-api) --
    # this job operates on manifests/ and the repo root, not the service
    # directory.
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.8.1
          sudo mv kustomize /usr/local/bin/

      - name: Bump shortlink-api image tag
        working-directory: manifests/overlays/production
        run: kustomize edit set image "$IMAGE:${{ github.sha }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi
          git commit -m "chore(manifests): deploy shortlink-api@${{ github.sha }}"
          # The concurrency group above should already serialize this
          # against the other services' update-manifest jobs; this retry
          # is a fallback in case main moved for any other reason between
          # checkout and push.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
