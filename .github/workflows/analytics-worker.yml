name: analytics-worker

on:
  push:
    branches: [main]
    paths:
      - "services/analytics-worker/**"
      - ".github/workflows/analytics-worker.yml"
  pull_request:
    paths:
      - "services/analytics-worker/**"
      - ".github/workflows/analytics-worker.yml"

concurrency:
  group: analytics-worker-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/snapshot-analytics-worker

defaults:
  run:
    working-directory: services/analytics-worker

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: services/analytics-worker/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: ruff
        run: ruff check .

      - name: pytest
        run: python -m pytest -q

  build-scan-push:
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: services/analytics-worker
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          push: false
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

  update-manifest:
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Shared group name across all three services' workflows -- see
    # shortlink-api.yml's update-manifest job for why.
    concurrency:
      group: manifest-update
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash -s 5.8.1
          sudo mv kustomize /usr/local/bin/

      - name: Bump analytics-worker image tag
        working-directory: manifests/overlays/production
        run: kustomize edit set image "$IMAGE:${{ github.sha }}"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifests/overlays/production/kustomization.yaml
          if git diff --cached --quiet; then
            echo "Manifest already up to date"
            exit 0
          fi
          git commit -m "chore(manifests): deploy analytics-worker@${{ github.sha }}"
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing onto latest main..."
            git pull --rebase origin main
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
